[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "poseidon-agent"
version = "4.1.1"
description = "Motor de ejecución determinista y orquestador de fases para Keel Nav."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Poseidon Agent contributors" },
]
dependencies = [
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    "questionary>=2.0,<3",
    "rich>=13.7,<15",
    "textual>=0.85,<10",
    "typer>=0.16,<1",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.optional-dependencies]
api = [
    "litellm>=1.60,<2",
]
binary = [
    "pyinstaller>=6.11,<7",
]
dev = [
    "fastapi>=0.115,<1",
    "pytest>=8.3,<10",
    "ruff>=0.8,<1",
]

[project.scripts]
poseidon = "poseidon.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/poseidon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
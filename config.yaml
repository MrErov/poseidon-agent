version: 2

roles:
  architect:
    executor: api
    model: nvidia_nim/moonshotai/kimi-k2-instruct
  tester:
    executor: opencode
    model: null
    runtime: herdr
    name_prefix: poseidon-tester

phase_roles:
  0: architect
  1a: architect
  1b: tester
  2: tester
  3: tester
  4: architect

herdr:
  executable: hc
  wait_timeout_seconds: 900
  read_lines: 1000
  keep: true
  outlive_parent: true
  mode: persistent
  launch: headless_in_terminal
  agent_model: ""
  agent_args: []

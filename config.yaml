version: 2

default_role: tester

roles:
  architect:
    executor: api
    model: nvidia_nim/moonshotai/kimi-k2-instruct
  tester:
    executor: opencode
    model: nvidia/nvidia/nemotron-3-ultra-550b-a55b
    runtime: herdr
    name_prefix: poseidon-tester

phase_roles:
  0: architect
  1a: architect
  1b: tester
  2: tester
  3: tester
  4: architect

herdr:
  executable: hc
  wait_timeout_seconds: 900
  read_lines: 1000
  keep: true
  outlive_parent: true
  mode: persistent
  launch: headless_in_terminal
  agent_model: ""
  agent_args: []
  auto_approve: true
  total_timeout_seconds: 3600
  progress_interval_seconds: 30
  phase_timeouts: {}

model_routing:
  planner: "nvidia_nim/moonshotai/kimi-k2-instruct"
  coder: "nvidia_nim/nemotron-3-ultra-550b-a55b"
  reviewer: "nvidia_nim/mistralai/mistral-large-4-1t-a52b"
  default: "nvidia_nim/nemotron-3-ultra-550b-a55b"
